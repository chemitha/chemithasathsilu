<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - not found</title>
    <!-- Targeting the old onrender domain to redirect to custom domain -->
    <script src="./js/domain-fallback.js"></script>
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Color+Emoji&family=Noto+Emoji:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        :root{
            --bg: #f8f9fa;
            --text: #222;
            --subtext: #888;
            --card-bg: #fff;
            --border: #ddd;
            --link: #007bff;
            --link-hover: #0056b3;
        }
        *{
            font-family: Poppins;
            overflow: hidden;
            color: var(--text);
        }
        .headline{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .headline img{
            width: 400px;
            aspect-ratio: 1 / 1 ;
        }
        .image-container{
            position: relative;
            display: inline-block;
            opacity: 70%;
        }
        .image-container::after{
            content:'';
            top: 0;
            right: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 -10px 20px 10px white; 
            pointer-events: none;
        }
        .image-container img{
            display: block;
            height: auto;
        }
        footer{
            position: fixed;
            right: 50%;
            bottom: 1rem;
            transform: translate(50%, 12px);
            z-index: 40;
        }
        footer p {
            font-size: 0.7rem;
            color: #888;
            text-align: center;
            font-family: 'Poppins', 'Arial', sans-serif;
        }

        @media (max-width:425px) {
            .headline{
                font-size: small;
            }
            footer p{
                font-size: 0.6rem;
            }
        }
        @media (max-width:425px) {
            .headline img{
                width: 250px;
            }
        }
        @media (max-height:424px) {
            .headline img{
                display: none;
            }
        }
        @media (max-height:160px){
            .headline p{
                content-visibility: hidden;
            }
        }
    </style>
    <div class="headline" style="filter:blur(10px);">
        <img src="./assets/images/404.webp" alt="">
        <h1>404 NOT FOUND</h1>
        <p>The page you are looking for cannot be found. It may have been <br /> <strong> moved, removed, or is under development.</strong></p>
    </div>
<footer>
  <p id="footer-text"></p>
</footer>

<script>
  const startYear = 2025; // Year the website started
  const currentYear = new Date().getFullYear();
  const yearsActive = currentYear - startYear;

  let yearText = startYear;
  if (yearsActive > 0) {
    yearText += ` - ${currentYear}`;
  }

  let yearsOnlineText = '';
  if (yearsActive > 0) {
    yearsOnlineText = ` | ${yearsActive} year${yearsActive > 1 ? 's' : ''} online`;
  }

  document.getElementById('footer-text').innerHTML =
    `© ${yearText} - <a href="http://chemitha.com">Chemitha Sathsilu</a>${yearsOnlineText}`;
</script>

<!-- Time-based unblur (.headline) -->
 <script>
    const headline = document.querySelector('.headline');
    let blurValue = 10;

    const unblurInterval = setInterval (() => {
        blurValue -= 1;

        if (blurValue > 1){
            headline.style.filter = `blur(${blurValue}px)`;
        } else {
            headline.style.filter = `blur(1px)`;
            clearInterval(unblurInterval);
        }
    }, 100)
 </script>

    
</body>
</html>
