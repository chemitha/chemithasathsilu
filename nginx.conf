server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs for HTML files
    location / {
        # If the request matches a file, serve it
        try_files $uri $uri/ @clean_urls;
    }

    # Rewrite clean URLs to .html
    location @clean_urls {
        rewrite ^/(.*)$ /$1.html break;
    }

    # Optional: custom 404
    error_page 404 /404.html;
}

# Serve labs subdomain from the 'labs' directory
server {
    listen 80;
    server_name labs.chemitha.com;

    root /usr/share/nginx/html/labs;
    index index.html;

    location / {
        try_files $uri $uri/ @clean_urls;
    }

    location @clean_urls {
        rewrite ^/(.*)$ /$1.html break;
    }

    error_page 404 /404.html;
}

# Redirect old /showcase path to labs subdomain
server {
    listen 80;
    server_name chemitha.com www.chemitha.com;

    location = /showcase {
        return 301 https://labs.chemitha.com/;
    }
}
