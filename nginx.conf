server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs for HTML files
    location / {
        # If the request matches a file, serve it
        try_files $uri $uri/ @clean_urls;
    }

    # Rewrite clean URLs to .html
    location @clean_urls {
        rewrite ^/(.*)$ /$1.html break;
    }

    # Optional: custom 404
    error_page 404 /404.html;
}
